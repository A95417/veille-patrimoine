name: Essai calendrier
on:
  workflow_dispatch:
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sS https://www.impots.gouv.fr/robots.txt | grep -iE "user-agent|calendrier|disallow: /particulier|disallow: /$" | head -20
          curl -sS -A "VeillePatrimoineBot/1.0" https://www.impots.gouv.fr/particulier/calendrier-fiscal/2026-12 -o p.html; wc -c p.html
          python3 - <<'PY'
          import re
          h=open("p.html",encoding="utf-8",errors="replace").read()
          i=h.find("calendrier"); 
          m=re.search(r'<main.*?</main>', h, re.S)
          t=m.group(0) if m else h
          t=re.sub(r'<(script|style|svg)[\s\S]*?</\1>','',t)
          print(re.sub(r'\n\s*\n+','\n',t)[:6000])
          PY
