name: Essai taux
on:
  workflow_dispatch:
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/taux.mjs
        env:
          TAUX_ESSAI: oui
