# Mise en ligne automatique du site sur Cloudflare.
# Se déclenche à chaque modification du dépôt, ou à la main (bouton "Run workflow").
name: Mise en ligne du site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule mise en ligne à la fois : les suivantes attendent leur tour
# (évite que deux mises en ligne se gênent quand on dépose plusieurs dossiers d'affilée).
concurrency:
  group: mise-en-ligne
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Publier sur Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # 1) met à jour les tables de la base, 2) publie le site
          command: |
            d1 migrations apply veille-db --remote
            deploy
          # Transmet au site le code d'installation rangé dans le coffre GitHub
          secrets: |
            SETUP_CODE
            ROBOT_TOKEN
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          ROBOT_TOKEN: ${{ secrets.ROBOT_TOKEN }}
