<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · Veille Patrimoine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#3a49d6">
  <meta name="apple-mobile-web-app-title" content="Veille">
  <script src="/commun.js"></script>
</head>
<body>
  <main class="centre">
    <form class="carte carte-etroite" id="formulaire">
      <h1>Veille Patrimoine</h1>
      <p class="doux">Accès réservé. Connectez-vous avec le compte créé par votre administrateur.</p>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="mdp">Mot de passe</label>
      <input id="mdp" type="password" autocomplete="current-password" required>
      <button class="bouton bouton-large" id="bouton" type="submit">Se connecter</button>
      <div class="message" id="message" role="alert"></div>
    </form>
  </main>
  <script>
    document.getElementById("formulaire").addEventListener("submit", async (e) => {
      e.preventDefault();
      const bouton = document.getElementById("bouton");
      const message = document.getElementById("message");
      bouton.disabled = true;
      afficherMessage(message, "");
      try {
        await appelApi("/api/connexion", "POST", {
          email: document.getElementById("email").value,
          mot_de_passe: document.getElementById("mdp").value,
        });
        location.href = "/";
      } catch (err) {
        afficherMessage(message, err.message, "ko");
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
