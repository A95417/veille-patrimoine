<!doctype html>
<!-- version 9.0 -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sujet · Veille Patrimoine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#3a49d6">
  <meta name="apple-mobile-web-app-title" content="Veille">
  <script src="/commun.js"></script>
  <style>
    .contenu { max-width: 820px; }
    h1 { font-size: 1.7rem; line-height: 1.25; margin: 12px 0 8px; }
    .barre-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 18px; }
    .barre-actions .bouton { min-height: 38px; padding: 7px 14px; font-size: .9rem; }
    .favori-large { width: auto; height: 38px; padding: 0 14px; gap: 6px; display: inline-flex; border-color: var(--bord); background: var(--carte); margin: 0; font: inherit; font-size: .9rem; color: var(--texte); }
    .banniere { border-radius: var(--rayon); overflow: hidden; margin-bottom: 16px; border: 1px solid var(--bord); }
    .bloc h2 { font-size: 1.05rem; }
    .bloc p, .bloc li { font-size: 1rem; line-height: 1.6; }
    .bloc ul { margin: 0; padding-left: 20px; }
    .profil { font-weight: 600; }
    .parler { background: var(--accent-doux); border-radius: 12px; padding: 12px 16px; font-style: italic; margin: 0; }
    .avertissement { font-size: .85rem; color: var(--doux); border: 1px dashed var(--bord-fort); border-radius: 12px; padding: 10px 14px; }
    .article { padding: 10px 0; border-bottom: 1px solid var(--bord); }
    .article:last-child { border: 0; }
    .article a { font-weight: 600; }
  </style>
</head>
<body>
  <header class="entete" id="entete"></header>
  <main class="page contenu">
    <p><a href="/">← Retour aux actualités</a></p>
    <div id="sujet"><p class="doux">Chargement…</p></div>
  </main>
  <script>
    const liste = (l) => `<ul>${l.map((x) => `<li>${echapper(x)}</li>`).join("")}</ul>`;

    function afficher(s) {
      const n = s.importance || 0;
      const d = s.resume_detail;
      const basSurTitre = s.articles.every((a) => !a.extrait || a.extrait.length < 40);
      document.title = (s.titre_fr || s.titre) + " · Veille Patrimoine";
      const t = themeDe(s.categories);
      let html = `
        <div class="banniere">${visuel(s, t, imageDe(s) ? 260 : 130)}</div>
        <div class="meta th-${t.id}">
          ${(s.categories || []).map((c) => `<span class="etiquette">${echapper(c)}</span>`).join("")}
          ${n ? `<span class="niveau n${n}">Importance ${n}/5</span>` : ""}
        </div>
        <h1>${echapper(s.titre_fr || s.titre)}</h1>
        ${s.titre_fr && s.titre_fr !== s.titre ? `<p class="titre-original">Titre original : ${echapper(s.titre)}</p>` : ""}
        <p class="doux">Dernière publication ${quand(s.derniere_pub)} · ${s.articles.length} article${s.articles.length > 1 ? "s" : ""}</p>
        <div class="barre-actions no-print">
          ${boutonFavori(s.id).replace('class="favori"', 'class="favori favori-large"').replace('aria-label="Ma sélection">', 'aria-label="Ma sélection">').replace("</svg></button>", '</svg><span>Ma sélection</span></button>')}
          ${d ? `<button type="button" class="bouton bouton-discret" id="btn-ecouter">${ICONE_ECOUTE} Écouter</button>` : ""}
          <a class="bouton bouton-discret" href="/linkedin?sujet=${encodeURIComponent(s.id)}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg> Préparer un post LinkedIn</a>
          <button type="button" class="bouton bouton-discret" id="btn-copier">Copier le résumé</button>
          ${d && d.parler_client ? `<button type="button" class="bouton bouton-discret" id="btn-client">Copier la phrase client</button>` : ""}
          ${navigator.share ? `<button type="button" class="bouton bouton-discret" id="btn-partager">Partager</button>` : ""}
          <button type="button" class="bouton bouton-discret" onclick="print()">Imprimer</button>
        </div>`;

      if (d) {
        html += `
          <section class="carte bloc"><h2>L'essentiel</h2><p>${echapper(d.essentiel)}</p></section>
          <section class="carte bloc"><h2>Les points clés</h2>${liste(d.points_cles || [])}</section>
          <section class="carte bloc"><h2>Contexte</h2><p>${echapper(d.contexte)}</p></section>
          <section class="carte bloc"><h2>Impact pour mes clients</h2>
            <ul>${(d.impact_clients || []).map((i) => `<li><span class="profil">${echapper(i.profil)} :</span> ${echapper(i.impact)}</li>`).join("")}</ul></section>
          <section class="carte bloc"><h2>Comment en parler à un client</h2><p class="parler">${echapper(d.parler_client)}</p></section>`;
      } else if (s.resume_court) {
        html += `<section class="carte bloc"><h2>Résumé</h2><p>${echapper(s.resume_court)}</p>
          ${n >= 3 ? `<p class="doux">Le résumé détaillé est en cours de préparation par l'IA.</p>` : ""}</section>`;
      } else {
        html += `<section class="carte bloc"><p class="doux">Ce sujet n'a pas encore été analysé par l'IA (file d'attente). Le chapô de la source est affiché ci-dessous.</p></section>`;
      }

      html += `<section class="carte bloc"><h2>Sources</h2>${s.articles.map((a) => `
        <div class="article">
          <a href="${echapper(a.lien)}" target="_blank" rel="noopener noreferrer">${echapper(a.titre)} ↗</a>
          <div class="doux" style="font-size:.85rem">${echapper(a.source_nom)} · publié le ${new Date(a.publie_le).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" })}${a.langue === "en" ? " · en anglais" : ""}</div>
          ${a.extrait ? `<p style="margin:6px 0 0;font-size:.92rem">${echapper(a.extrait.slice(0, 600))}${a.extrait.length > 600 ? "…" : ""}</p>` : ""}
        </div>`).join("")}</section>`;

      html += `<p class="avertissement">${d && d.limites ? echapper(d.limites) + " " : ""}
        Résumé produit par une IA à partir ${basSurTitre ? "du seul titre" : "du titre et du chapô"} publiés gratuitement par la source, et non de l'article complet.
        Vérifiez les points importants dans l'article original avant d'en faire état. Ce contenu est informatif et ne constitue pas un conseil en investissement.</p>`;
      document.getElementById("sujet").innerHTML = html;

      // Résumé à transmettre : titre, l'essentiel, la source vérifiable (jamais un lien vers ce site privé).
      const source = s.articles[0];
      const resume = d ? d.essentiel : s.resume_court || "";
      const texteCopie = `${s.titre_fr || s.titre}\n\n${resume}${d && d.points_cles ? "\n\n" + d.points_cles.map((p) => "• " + p).join("\n") : ""}` +
        `\n\nSource : ${source.source_nom} — ${source.lien}`;
      document.getElementById("btn-copier").onclick = () => copier(texteCopie);
      const bc = document.getElementById("btn-client");
      if (bc) bc.onclick = () => copier(d.parler_client);
      const bp = document.getElementById("btn-partager");
      if (bp) bp.onclick = () => navigator.share({ title: s.titre_fr || s.titre, text: resume, url: source.lien }).catch(() => {});
      const be = document.getElementById("btn-ecouter");
      if (be) be.onclick = (e) => lireAVoixHaute([s.titre_fr || s.titre, d.essentiel, ...(d.points_cles || []), d.contexte,
        "Comment en parler à un client.", d.parler_client].filter(Boolean).join(". "), e.currentTarget);
    }

    chargerEntete("").then(async () => {
      const id = new URLSearchParams(location.search).get("id");
      try { afficher(await appelApi("/api/sujet?id=" + encodeURIComponent(id || ""))); }
      catch (e) { document.getElementById("sujet").innerHTML = `<p class="message ko">${echapper(e.message)}</p>`; }
    });
  </script>
</body>
</html>
