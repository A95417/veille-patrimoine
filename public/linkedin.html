<!doctype html>

  <style>
    .li-tete { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 16px; }
    .li-tete h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 1.8rem); }
    .li-tete p { margin: 2px 0 0; color: var(--doux); }
    .li-grille { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
    .li-cote { position: sticky; top: 84px; display: grid; gap: 16px; }
    @media (max-width: 1000px) { .li-grille { grid-template-columns: minmax(0, 1fr); } .li-cote { position: static; } }

    /* Barre d'étapes */
    .etapes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .etape-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--bord); background: var(--carte); color: var(--doux); font: inherit; text-align: left; cursor: pointer; min-width: 0; }
    .etape-btn:disabled { cursor: default; opacity: .55; }
    .etape-btn .n { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--fond); color: var(--doux); }
    .etape-btn .t { display: grid; min-width: 0; }
    .etape-btn .t b { color: var(--texte); font-size: .95rem; }
    .etape-btn .t small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .78rem; }
    .etape-btn.fait .n { background: var(--ok); color: #fff; }
    .etape-btn.actif { border-color: var(--accent); background: var(--accent-doux); }
    .etape-btn.actif .n { background: var(--accent); color: var(--accent-texte); }
    @media (max-width: 560px) { .etape-btn { flex-direction: column; text-align: center; gap: 4px; padding: 8px 4px; } .etape-btn .t small { display: none; } }

    .panneau[hidden] { display: none !important; }
    .panneau h2 { margin: 0 0 4px; font-size: 1.2rem; }
    .panneau > .doux { margin: 0 0 14px; }
    .onglets { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--bord); margin-bottom: 14px; }
    .onglets::-webkit-scrollbar { display: none; }
    .onglets .puce { flex: 0 0 auto; border: 0; border-bottom: 2.5px solid transparent; border-radius: 0; background: none; color: var(--doux); font-weight: 600; font-size: .9rem; padding: 8px 10px; margin-bottom: -1px; box-shadow: none; white-space: nowrap; }
    .onglets .puce:hover { color: var(--texte); background: none; }
    .onglets .puce[aria-pressed="true"] { color: var(--accent-fonce); border-bottom-color: var(--accent); background: none; }
    .idee .choix-carte .petit { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .liste-peda { display: grid; gap: 2px; }
    .peda { display: flex; align-items: center; gap: 8px; border-radius: 10px; }
    .peda:hover { background: var(--fond); }
    .peda-choix { flex: 1; min-width: 0; display: grid; gap: 1px; text-align: left; font: inherit; color: var(--texte); background: none; border: 0; padding: 8px 10px; cursor: pointer; }
    .peda-choix strong { font-weight: 600; font-size: .93rem; }
    .peda-choix span { font-size: .8rem; color: var(--doux); }
    .peda .peda-direct { flex: 0 0 auto; font-size: .85rem; text-decoration: none; padding: 8px 10px; }
    .conseils details + details { border-top: 1px solid var(--bord); margin-top: 10px; padding-top: 10px; }
    .conseils summary { cursor: pointer; font-weight: 700; font-size: .98rem; padding: 2px 0; }
    .conseils details[open] summary { margin-bottom: 8px; }
    .idees { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .choix-carte { text-align: left; border: 1.5px solid var(--bord); background: var(--carte); color: var(--texte); border-radius: 14px; padding: 14px; cursor: pointer; font: inherit; display: grid; gap: 6px; align-content: start; transition: border-color .15s, transform .15s; width: 100%; box-sizing: border-box; }
    .choix-carte:hover { border-color: var(--accent); }
    .choix-carte[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-doux); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .choix-carte strong { line-height: 1.35; }
    .choix-carte .petit { color: var(--doux); line-height: 1.4; }
    .idee { display: grid; grid-template-rows: 1fr auto; border: 1.5px solid var(--bord); border-radius: 14px; overflow: hidden; background: var(--carte); }
    .idee .choix-carte { border: 0; border-radius: 0; }
    .idee-actions { display: flex; border-top: 1px solid var(--bord); }
    .idee-actions button { flex: 1; font: inherit; font-size: .82rem; font-weight: 600; padding: 7px; border: 0; background: none; cursor: pointer; color: var(--accent-fonce); }
    .idee-actions button + button { border-left: 1px solid var(--bord); }
    .idee-actions button:hover { background: var(--accent-doux); }
    .tag { display: inline-block; width: fit-content; padding: 2px 9px; border-radius: 999px; background: var(--fond); color: var(--accent-fonce); font-size: .74rem; font-weight: 700; }
    .liste-actus { display: grid; gap: 8px; }
    .liste-actus .choix-carte { padding: 10px 12px; }
    .recap { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--accent-doux); margin: 0 0 16px; font-size: .92rem; }
    .recap button { flex: 0 0 auto; }
    .lien-bouton { font: inherit; background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px; text-decoration: underline; }
    .approches { display: flex; gap: 8px; flex-wrap: wrap; }
    .approches .puce { position: relative; }
    .approches .suggeree::after { content: "suggérée"; position: absolute; top: -8px; right: -4px; font-size: .62rem; font-weight: 700; background: var(--ok); color: #fff; padding: 1px 6px; border-radius: 999px; }
    .desc-approche { margin: 10px 0 18px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--fond); border-radius: 0 10px 10px 0; font-size: .92rem; }
    .reglages { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
    .reglages .simu-lib, .bloc-lib { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 6px; }
    details.precision summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: .92rem; padding: 4px 0; }
    .alerte-donnees { font-size: .85rem; color: var(--ko); margin: 6px 0 0; }
    .gros-bouton { font-size: 1.02rem; padding: 12px 22px; }
    .barre-mobile { display: none; }
    @media (max-width: 760px) {
      .barre-mobile:not([hidden]) { display: flex; position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom)); z-index: 40; padding: 10px 16px; background: var(--carte); border-top: 1px solid var(--bord); box-shadow: 0 -6px 18px rgba(0,0,0,.08); }
      .barre-mobile .bouton { flex: 1; justify-content: center; }
      body.avec-barre { padding-bottom: 150px; }
      .bouton-bureau { display: none !important; }
    }

    /* Aperçu façon LinkedIn */
    .apercu { border: 1px solid var(--bord); border-radius: 14px; background: var(--carte); padding: 16px; max-width: 560px; }
    .apercu-tete { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-texte); display: grid; place-items: center; font-weight: 700; flex: 0 0 46px; }
    .apercu-tete small { color: var(--doux); display: block; }
    .apercu-texte { white-space: pre-wrap; line-height: 1.5; font-size: .95rem; overflow-wrap: anywhere; }
    .apercu-texte .voir-plus { color: var(--doux); font-weight: 600; cursor: pointer; background: none; border: 0; font: inherit; padding: 0; }
    .apercu-texte .coupure { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .apercu-note { font-size: .8rem; color: var(--doux); margin: 8px 0 0; }
    textarea.post { width: 100%; min-height: 300px; font: inherit; line-height: 1.55; padding: 14px; border-radius: 12px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--texte); resize: vertical; box-sizing: border-box; }
    .compteur { font-size: .85rem; color: var(--doux); margin: 6px 0 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
    .perso { border-top: 1px solid var(--bord); margin-top: 18px; padding-top: 16px; display: grid; gap: 16px; }
    .accroches { display: grid; gap: 8px; }
    .accroches .choix-carte { padding: 10px 12px; }
    #ctas .puce { white-space: normal; text-align: left; line-height: 1.35; height: auto; max-width: 100%; border-radius: 14px; }
    .boite h3 { font-size: 1rem; margin: 0 0 10px; }
    .boite ol, .boite ul { margin: 0; padding-left: 20px; line-height: 1.6; font-size: .92rem; }
    .brouillon { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--bord); font-size: .9rem; }
    .attente { display: flex; gap: 12px; align-items: center; color: var(--doux); padding: 30px 0; justify-content: center; }
    .rond { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent-doux); border-top-color: var(--accent); animation: tourne 1s linear infinite; }
    @keyframes tourne { to { transform: rotate(360deg); } }
    .visuels { border-top: 1px solid var(--bord); margin-top: 18px; padding-top: 16px; }
    .visuels-tete { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .visuels-tete h3 { margin: 0; font-size: 1.05rem; }
    .visuels-grille { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
    @media (max-width: 700px) { .visuels-grille { grid-template-columns: minmax(0, 1fr); } }
    .visuel-zone img { width: 100%; height: auto; display: block; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    .carrousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; }
    .carrousel img { flex: 0 0 82%; width: 82%; scroll-snap-align: start; }
    .visuel-reglages input, .visuel-reglages textarea { width: 100%; box-sizing: border-box; }
    .apercu-img { display: block; width: calc(100% + 32px); margin: 12px -16px -16px; border-radius: 0 0 14px 14px; }
    .alt-texte { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--fond); font-size: .85rem; }
    .alt-texte p { margin: 4px 0 8px; }
    .conformite { border: 1px solid var(--ko); background: color-mix(in srgb, var(--ko) 8%, transparent); border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-size: .9rem; }
    .conformite ul { margin: 6px 0 0; padding-left: 20px; }
    .publie-barre { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--accent-doux); margin: 0 0 14px; font-size: .92rem; }
    .statut { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--fond); color: var(--doux); }
    .statut.publie { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .post-ligne { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--bord); font-size: .9rem; flex-wrap: wrap; }
    .post-ligne .actions-post { display: flex; gap: 4px; flex-wrap: wrap; }
    .post-ligne .actions-post .bouton { font-size: .8rem; padding: 6px 10px; }
    .sous-titre-idees { margin: 22px 0 10px; font-size: .95rem; }
    .reprise { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; border: 1px dashed var(--bord-fort); margin-bottom: 14px; font-size: .92rem; }

    /* Création Post : onglets Post / Vidéo */
    .cp-tete { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 6px 0 14px; }
    .cp-tete h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 1.9rem); }
    .cp-onglets { display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: var(--carte); border: 1px solid var(--bord); }
    .cp-onglets button { font: inherit; font-weight: 600; border: 0; background: none; color: var(--doux); padding: 9px 18px; border-radius: 999px; cursor: pointer; }
    .cp-onglets button[aria-selected="true"] { background: var(--accent); color: var(--accent-texte); }
    #vue-video { display: grid; gap: 16px; }
    #vue-video[hidden] { display: none; }
    #vue-video h2 { margin: 0 0 4px; font-size: 1.2rem; }
    #vue-video textarea { width: 100%; box-sizing: border-box; font: inherit; line-height: 1.5; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--texte); resize: vertical; }
    #vue-video > .carte { min-width: 0; max-width: 100%; box-sizing: border-box; }
    /* Vidéo : parcours en 3 étapes */
    .vv-form { display: grid; gap: 4px; }
    .vv-intro h2 { margin: 0 0 2px; }
    .vv-intro p { margin: 0 0 10px; }
    .vv-etape { border-top: 1px solid var(--bord); padding: 16px 0 6px; min-width: 0; }
    .vv-etape-tete { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.05rem; }
    .vv-etape-tete .n { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .9rem; font-weight: 700; background: var(--accent); color: var(--accent-texte); }
    .vv-etape.vv-faite .vv-etape-tete .n { background: var(--ok); color: #fff; font-size: 0; }
    .vv-etape.vv-faite .vv-etape-tete .n::before { content: "✓"; font-size: .9rem; }
    .vv-etape.vv-attente .vv-etape-tete { color: var(--doux); margin-bottom: 4px; }
    .vv-etape.vv-attente .vv-etape-tete .n { background: var(--fond); color: var(--doux); }
    .vv-etape-corps { padding-left: 38px; min-width: 0; }
    .vv-etape-corps[hidden] { display: none; }
    @media (max-width: 640px) { .vv-etape-corps { padding-left: 0; } }
    .vv-onglets { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--bord); margin-bottom: 12px; }
    .vv-onglets::-webkit-scrollbar { display: none; }
    .vv-onglets button { flex: 0 0 auto; font: inherit; font-size: .9rem; font-weight: 600; color: var(--doux); background: none; border: 0; border-bottom: 2.5px solid transparent; padding: 8px 10px; cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
    .vv-onglets button:hover { color: var(--texte); }
    .vv-onglets button[aria-selected="true"] { color: var(--accent-fonce); border-bottom-color: var(--accent); }
    .vv-panneau { min-width: 0; }
    .vv-idees { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .vv-idee { text-align: left; font: inherit; color: var(--texte); background: var(--carte); border: 1.5px solid var(--bord); border-radius: 14px; padding: 12px 14px; cursor: pointer; display: grid; gap: 8px; align-content: space-between; transition: border-color .15s; }
    .vv-idee strong { line-height: 1.3; font-size: .95rem; }
    .vv-idee:hover { border-color: var(--accent); }
    .vv-tag { width: fit-content; padding: 2px 9px; border-radius: 999px; background: var(--accent-doux); color: var(--accent-fonce); font-size: .76rem; font-weight: 700; }
    .vv-note { margin: 8px 0 0; }
    .vv-vide { margin: 6px 0; }
    .vv-cherche { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--texte); margin-bottom: 10px; }
    .vv-liste { display: grid; gap: 14px; max-height: 360px; overflow-y: auto; padding-right: 4px; overscroll-behavior: contain; }
    .vv-groupe { display: grid; gap: 2px; }
    .vv-groupe-nom { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 0 0 4px; }
    .vv-ligne { display: grid; gap: 1px; text-align: left; font: inherit; color: var(--texte); background: none; border: 0; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
    .vv-ligne strong { font-weight: 600; font-size: .93rem; line-height: 1.3; }
    .vv-ligne span { font-size: .8rem; color: var(--doux); }
    .vv-ligne:hover { background: var(--fond); }
    .vv-ligne[aria-pressed="true"] { background: var(--accent-doux); }
    .vv-choisi { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--accent-doux); border: 1.5px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .vv-choisi[hidden] { display: none; }
    .vv-choisi-ico { font-size: 1.4rem; flex: 0 0 auto; }
    .vv-choisi > div { display: grid; gap: 2px; min-width: 0; flex: 1; }
    .vv-choisi strong { line-height: 1.3; }
    .vv-choisi > div > span { font-size: .82rem; color: var(--doux); }
    .vv-choisi .bouton { flex: 0 0 auto; }
    .vv-angles { display: flex; flex-wrap: wrap; gap: 6px; }
    .vv-angles .puce.vv-conseille { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .vv-angle-desc { margin: 10px 0 14px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--fond); border-radius: 0 10px 10px 0; font-size: .9rem; }
    .vv-suggere { color: var(--accent-fonce); font-weight: 600; font-size: .82rem; white-space: nowrap; }
    #vv-precision { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--bord-fort); background: var(--carte); color: var(--texte); }
    .vv-reglages > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--bord); border-radius: 12px; cursor: pointer; }
    .vv-reglages > summary::-webkit-details-marker { display: none; }
    .vv-reglages[open] > summary { border-color: var(--accent); }
    .vv-modifier { color: var(--accent); font-weight: 600; font-size: .9rem; }
    .vv-reglages[open] .vv-modifier { font-size: 0; } .vv-reglages[open] .vv-modifier::after { content: "Fermer"; font-size: .9rem; }
    .vv-reglages-corps { padding: 14px 2px 4px; }
    .vv-coord { margin-top: 10px; border-top: 1px solid var(--bord); padding-top: 10px; }
    .vv-coord > summary { cursor: pointer; font-size: .88rem; color: var(--doux); }
    .vv-action { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--bord); padding-top: 16px; margin-top: 10px; }
    .vv-action #vv-quota { display: grid; gap: 2px; }
    .vv-action .bouton:disabled { opacity: .5; cursor: not-allowed; }
    .vv-compteur { font-weight: 600; } .vv-compteur.ko, .vv-equipe.ko { color: var(--ko); } .vv-equipe { color: var(--doux); }
    .vv-galerie-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .vv-galerie-tete h2 { margin: 0; }
    @media (max-width: 640px) {
      .vv-idees { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
      .vv-idee { flex: 0 0 78%; scroll-snap-align: start; }
      .vv-choisi { flex-wrap: wrap; gap: 8px 10px; align-items: flex-start; }
      .vv-choisi-ico { font-size: 1.15rem; }
      .vv-choisi > div { flex: 1 1 calc(100% - 40px); }
      .vv-choisi .bouton { margin-left: auto; padding: 6px 14px; font-size: .88rem; }
      .vv-angles { display: grid; grid-template-columns: 1fr 1fr; }
      .vv-angles .puce { justify-content: center; text-align: center; white-space: normal; line-height: 1.2; padding: 8px 6px; font-size: .86rem; }
      .vv-action .gros-bouton { flex: 1 1 100%; justify-content: center; }
    }
    .vv-sim { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--fond); }
    .vv-sim[hidden] { display: none; }
    .vv-sim-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }

<body>
  <header class="entete" id="entete"></header>
  <main class="page">
    <div class="cp-tete"><h1>Création Post</h1>
      <div class="cp-onglets" role="tablist" aria-label="Type de contenu">
        <button type="button" role="tab" id="tab-post" aria-selected="true" aria-controls="vue-post">✏️ Post LinkedIn</button>
        <button type="button" role="tab" id="tab-video" aria-selected="false" aria-controls="vue-video">🎬 Vidéo</button>
      </div></div>
    <div id="vue-video" role="tabpanel" aria-labelledby="tab-video" hidden></div>
    <div id="vue-post" role="tabpanel" aria-labelledby="tab-post"></div>
  </main>
  <script>
    // Onglets Création Post : Post LinkedIn / Vidéo (mémorisé dans l'adresse : ?onglet=video).
    const $c = (id) => document.getElementById(id);
    let postPret = false;
    function choisirVue(vue, memoriser = true) {
      const video = vue === "video";
      $c("vue-post").hidden = video; $c("vue-video").hidden = !video;
      $c("tab-post").setAttribute("aria-selected", !video); $c("tab-video").setAttribute("aria-selected", video);
      document.body.classList.toggle("vue-video", video);
      if (video) window.demarrerVideo();
      else if (!postPret) { postPret = true; window.demarrerPost(); }
      if (memoriser) { const u = new URL(location.href); if (video) u.searchParams.set("onglet", "video"); else u.searchParams.delete("onglet"); history.replaceState(null, "", u); }
    }
    window.choisirVue = choisirVue;
    $c("tab-post").onclick = () => choisirVue("post");
    $c("tab-video").onclick = () => choisirVue("video");
    chargerEntete("/linkedin").then(() => choisirVue(new URLSearchParams(location.search).get("onglet") === "video" ? "video" : "post", false));
  </script>
</body>
</html>
