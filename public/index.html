<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil · Veille Patrimoine</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/commun.js"></script>
  <style>
    .barre { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    /* À la une */
    .une { border: 1px solid var(--ko); border-left: 5px solid var(--ko); border-radius: var(--rayon); background: var(--carte);
           padding: 14px 18px; margin-bottom: 18px; }
    .une h2 { color: var(--ko); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
    .une ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .une a { color: var(--texte); font-weight: 600; text-decoration: none; }
    .une a:hover { text-decoration: underline; }
    /* Filtres */
    .filtres { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 8px; margin-bottom: 16px; align-items: end; }
    .filtres label { margin: 0 0 4px; font-size: .8rem; color: var(--doux); font-weight: 600; }
    select { width: 100%; padding: 8px 10px; font: inherit; font-size: .9rem; color: var(--texte); background: var(--carte);
             border: 1px solid var(--bord); border-radius: 8px; }
    @media (max-width: 720px) { .filtres { grid-template-columns: 1fr 1fr; } }
    /* Cartes */
    .fil { display: grid; gap: 14px; }
    .sujet { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 16px 18px; }
    .sujet.n5 { border-left: 5px solid var(--ko); }
    .sujet.n4 { border-left: 5px solid #d97706; }
    .sujet h3 { margin: 6px 0 8px; font-size: 1.05rem; line-height: 1.35; }
    .sujet h3 a { color: var(--texte); text-decoration: none; }
    .sujet h3 a:hover { text-decoration: underline; }
    .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 0.8rem; color: var(--doux); }
    .niveau { font-weight: 700; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--bord); color: var(--texte); }
    .niveau.n5 { background: var(--ko); color: #fff; border-color: var(--ko); }
    .niveau.n4 { background: #d97706; color: #fff; border-color: #d97706; }
    .cat { padding: 1px 8px; border-radius: 99px; background: var(--fond); border: 1px solid var(--bord); }
    .resume { margin: 0 0 10px; font-size: 0.95rem; }
    .sources { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .source { font-size: 0.8rem; padding: 3px 9px; border: 1px solid var(--bord); border-radius: 99px;
              color: var(--texte); text-decoration: none; background: var(--fond); }
    .source:hover { border-color: var(--accent); }
    .lien-detail { font-size: .85rem; font-weight: 600; margin-left: auto; }
    .vide { text-align: center; padding: 40px 16px; }
  </style>
</head>
<body>
  <header class="entete" id="entete"></header>
  <main class="page">
    <section class="une" id="une" hidden>
      <h2>À la une</h2>
      <ul id="une-liste"></ul>
    </section>

    <div class="barre">
      <h1>Actualités</h1>
      <span class="doux" id="info-maj"></span>
    </div>

    <form class="filtres" id="filtres">
      <div><label for="f-categorie">Catégorie</label><select id="f-categorie"><option value="">Toutes</option></select></div>
      <div><label for="f-source">Source</label><select id="f-source"><option value="">Toutes</option></select></div>
      <div><label for="f-importance">Importance</label>
        <select id="f-importance">
          <option value="">Toutes</option><option value="5">5 seulement</option><option value="4">4 et plus</option><option value="3">3 et plus</option>
        </select></div>
      <div><label for="f-periode">Période</label>
        <select id="f-periode">
          <option value="">Tout (3 mois)</option><option value="24h">24 heures</option><option value="7j">7 jours</option><option value="30j">30 jours</option>
        </select></div>
      <button class="bouton bouton-discret" type="button" id="f-effacer">Effacer</button>
    </form>

    <div class="fil" id="fil"><p class="doux">Chargement…</p></div>
    <div style="text-align:center;margin:20px 0">
      <button class="bouton bouton-discret" id="btn-suite" hidden>Afficher plus d'actualités</button>
    </div>

    <details class="carte carte-etroite" style="margin-top:30px">
      <summary style="cursor:pointer;font-weight:600">Mon compte : changer mon mot de passe</summary>
      <form id="form-mdp">
        <label for="actuel">Mot de passe actuel</label>
        <input id="actuel" type="password" autocomplete="current-password" required>
        <label for="nouveau">Nouveau mot de passe (10 caractères minimum)</label>
        <input id="nouveau" type="password" autocomplete="new-password" minlength="10" required>
        <button class="bouton bouton-large" type="submit">Enregistrer</button>
        <div class="message" id="msg-mdp" role="alert"></div>
      </form>
    </details>
  </main>
  <script>
    const GROUPES = { officielle: "Officiel", presse: "Presse", international: "International", crypto: "Crypto" };
    const CHAMPS = ["categorie", "source", "importance", "periode"];
    let suite = null;

    function carte(s) {
      const principal = s.articles[s.articles.length - 1] || s.articles[0];
      const n = s.importance || 0;
      const sources = [...new Map(s.articles.map((a) => [a.source_nom, a])).values()];
      const texte = s.resume_court || (s.articles.find((a) => a.extrait && a.extrait.length > 40) || {}).extrait || "";
      return `<article class="sujet ${n >= 4 ? "n" + n : ""}">
        <div class="meta">
          ${n ? `<span class="niveau n${n}" title="Importance attribuée par l'IA">${n}/5</span>` : ""}
          <span>${GROUPES[principal.groupe] || ""}</span><span>·</span><span>${quand(s.derniere_pub)}</span>
          ${(s.categories || []).map((c) => `<span class="cat">${echapper(c)}</span>`).join("")}
        </div>
        <h3><a href="/sujet?id=${encodeURIComponent(s.id)}">${echapper(s.titre)}</a></h3>
        ${texte ? `<p class="resume">${echapper(texte)}</p>` : ""}
        <div class="sources">
          ${sources.slice(0, 4).map((a) => `<a class="source" href="${echapper(a.lien)}" target="_blank" rel="noopener noreferrer">${echapper(a.source_nom)} ↗</a>`).join("")}
          ${s.articles.length > 1 ? `<span class="doux" style="font-size:.8rem">${s.articles.length} articles</span>` : ""}
          <a class="lien-detail" href="/sujet?id=${encodeURIComponent(s.id)}">${n >= 3 ? "Résumé détaillé →" : "Détails →"}</a>
        </div>
      </article>`;
    }

    function filtresActuels() {
      const p = new URLSearchParams();
      for (const c of CHAMPS) { const v = document.getElementById("f-" + c).value; if (v) p.set(c, v); }
      return p;
    }

    async function charger(ajouter) {
      const p = filtresActuels();
      p.set("limite", "30");
      if (ajouter && suite) p.set("avant", suite);
      const r = await appelApi("/api/actualites?" + p);
      suite = r.suite;
      const fil = document.getElementById("fil");
      const html = r.sujets.map(carte).join("");
      if (ajouter) fil.insertAdjacentHTML("beforeend", html);
      else fil.innerHTML = html || `<div class="carte vide"><strong>Aucune actualité pour ces filtres.</strong></div>`;
      document.getElementById("btn-suite").hidden = !suite;
      document.getElementById("info-maj").textContent = "Affiché à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }

    async function chargerUne() {
      const { sujets } = await appelApi("/api/une");
      document.getElementById("une").hidden = !sujets.length;
      document.getElementById("une-liste").innerHTML = sujets.map((s) =>
        `<li><a href="/sujet?id=${encodeURIComponent(s.id)}">${echapper(s.titre)}</a>
          <span class="doux" style="font-size:.85rem"> · ${[...new Set(s.articles.map((a) => a.source_nom))].map(echapper).join(", ")} · ${quand(s.derniere_pub)}</span></li>`).join("");
    }

    async function chargerFiltres() {
      const { sources, categories } = await appelApi("/api/filtres");
      document.getElementById("f-categorie").insertAdjacentHTML("beforeend",
        categories.map((c) => `<option value="${echapper(c.nom)}">${echapper(c.nom)} (${c.n})</option>`).join(""));
      document.getElementById("f-source").insertAdjacentHTML("beforeend",
        sources.map((s) => `<option value="${echapper(s.id)}">${echapper(s.nom)}</option>`).join(""));
      // Restaure les filtres choisis lors de la dernière visite (sur cet appareil).
      try {
        const memo = JSON.parse(localStorage.getItem("filtres") || "{}");
        for (const c of CHAMPS) if (memo[c]) document.getElementById("f-" + c).value = memo[c];
      } catch {}
    }

    for (const c of CHAMPS) document.getElementById("f-" + c).addEventListener("change", () => {
      try { localStorage.setItem("filtres", JSON.stringify(Object.fromEntries(filtresActuels()))); } catch {}
      charger(false);
    });
    document.getElementById("f-effacer").onclick = () => {
      for (const c of CHAMPS) document.getElementById("f-" + c).value = "";
      try { localStorage.removeItem("filtres"); } catch {}
      charger(false);
    };
    document.getElementById("btn-suite").onclick = () => charger(true);

    chargerEntete("/").then(async () => {
      await chargerFiltres();
      chargerUne();
      charger(false);
    });
    setInterval(() => { if (!document.hidden && scrollY < 200) { chargerUne(); charger(false); } }, 5 * 60 * 1000);

    document.getElementById("form-mdp").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg-mdp");
      try {
        await appelApi("/api/moi/mot-de-passe", "POST", {
          actuel: document.getElementById("actuel").value,
          nouveau: document.getElementById("nouveau").value,
        });
        e.target.reset();
        afficherMessage(msg, "Mot de passe modifié.", "ok");
      } catch (err) { afficherMessage(msg, err.message, "ko"); }
    });
  </script>
</body>
</html>
