<!doctype html>
<!-- version 11.0 — essentiel en puces, incontournables, barre de sections, progression, glossaire, filtre, importance -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brief du jour · Veille Patrimoine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#3a49d6">
  <meta name="apple-mobile-web-app-title" content="Veille">
  <script src="/commun.js"></script>
  <script src="/jeux.js"></script>
  <script src="/schemas-brief.js"></script>
  <script src="/glossaire.js"></script>
  <style>
    .brief-page { max-width: 1320px; }
    .brief-grille { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; align-items: start; }
    .brief-nav { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 22px; }
    .brief-nav .petit-titre { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--doux); margin: 0 0 8px; }
    .onglets { display: flex; flex-direction: column; gap: 6px; }
    .onglets button { font: inherit; font-size: .95rem; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); padding: 12px 14px; border-radius: 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; text-align: left; }
    .onglets button:hover:not(:disabled) { border-color: var(--accent); }
    .onglets button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-texte); font-weight: 600; }
    .onglets button:disabled { opacity: .45; cursor: not-allowed; }
    .brief-nav select { width: 100%; }
    .sommaire { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--bord); }
    .sommaire a { display: block; padding: 7px 14px; margin-left: -2px; border-left: 2px solid transparent; color: var(--doux); text-decoration: none; font-size: .92rem; }
    .sommaire a:hover { color: var(--texte); }
    .sommaire a.actif { color: var(--accent-fonce); border-left-color: var(--accent); font-weight: 600; }
    #brief > section { margin-bottom: 28px; scroll-margin-top: 90px; }
    @media (max-width: 1000px) { #brief > section { scroll-margin-top: 70px; } }
    #brief .carte { padding: 28px 32px; }
    @media (max-width: 1000px) {
      .brief-grille { grid-template-columns: minmax(0, 1fr); gap: 18px; }
      .brief-nav { position: static; flex-direction: row; flex-wrap: wrap; align-items: end; gap: 12px; }
      .brief-nav .bloc-sommaire { display: none; }
      .onglets { flex-direction: row; }
      .onglets button { padding: 9px 12px; }
      #brief .carte { padding: 20px; }
    }
    .bloc h2 { font-size: 1.25rem; margin: 0 0 20px; }
    .mini-marches { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 18px; font-size: .95rem; }
    .mini-marches div { display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: var(--fond); }
    .retenir { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .retenir li { display: flex; flex-direction: column; gap: 10px; line-height: 1.6; padding: 18px 20px; border-radius: 16px; background: var(--fond); }
    .retenir-num { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-texte);
                   font-weight: 700; display: grid; place-items: center; font-size: .9rem; }
    .retenir a { font-size: .88rem; margin-top: auto; }
    .actus { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
    .actu { display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border: 1px solid var(--bord); border-radius: 16px; background: var(--carte); }
    .actu-haut { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .actu h3 { margin: 0; font-size: 1.08rem; line-height: 1.4; }
    .actu h3 a { color: var(--texte); text-decoration: none; }
    .actu h3 a:hover { text-decoration: underline; }
    .actu p { margin: 0; font-size: .95rem; line-height: 1.6; color: var(--doux); }
    .actu .sources { margin-top: auto; padding-top: 6px; }
    .chiffre-brief { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
    /* Schémas des actualités */
    .schema { margin: 4px 0 2px; padding: 14px 16px; border-radius: 14px; background: var(--i0, var(--fond)); color: var(--texte); }
    .schema figcaption { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: .9rem; margin-bottom: 10px; color: var(--i3, var(--accent-fonce)); }
    .sch-icone { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--carte); color: var(--i3, var(--accent)); flex: 0 0 34px; }
    .sch-chiffre { display: flex; flex-direction: column; gap: 2px; }
    .sch-valeur { font-family: var(--titre); font-weight: 700; font-size: 2.3rem; line-height: 1.1; color: var(--i3, var(--accent-fonce)); }
    .sch-legende { font-size: .92rem; color: var(--texte); }
    .sch-aa { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
    .sch-boite { background: var(--carte); border-radius: 12px; padding: 10px 12px; font-size: .9rem; line-height: 1.35; display: flex; flex-direction: column; gap: 4px; }
    .sch-apres { box-shadow: inset 0 0 0 2px var(--i3, var(--accent)); }
    .sch-etiquette { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--doux); }
    .sch-fleche { align-self: center; font-size: 1.3rem; font-weight: 700; color: var(--i3, var(--accent)); }
    .sch-etapes, .sch-points { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .sch-etapes li, .sch-points li { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; line-height: 1.4; }
    .sch-num, .sch-coche { flex: 0 0 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 700; background: var(--i3, var(--accent)); color: #fff; }
    .sch-coche { background: var(--carte); color: var(--i3, var(--accent)); }
    .actu .resume-long { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .actu .resume-long.ouvert { display: block; }
    .lire-suite { font: inherit; font-size: .85rem; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; width: fit-content; }
    /* Graphique des marchés */
    .g-marches { display: grid; gap: 8px; margin-top: 16px; }
    .gm-ligne { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 70px; gap: 12px; align-items: center; font-size: .92rem; }
    .gm-piste { position: relative; height: 18px; }
    .gm-zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--bord-fort); }
    .gm-barre { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; transition: width .4s ease; }
    .gm-barre.pos { background: var(--ok); } .gm-barre.neg { background: var(--ko); }
    .gm-val { text-align: right; font-weight: 600; } .gm-val.pos { color: var(--ok); } .gm-val.neg { color: var(--ko); }
    /* Lecture Express (façon stories) */
    .bouton-express { background: #ffd23f !important; color: #1b1f3b !important; font-weight: 700; }
    .express { position: fixed; inset: 0; z-index: 100; background: var(--fond); display: flex; flex-direction: column; align-items: center; }
    .ex-barres { display: flex; gap: 4px; width: min(560px, calc(100% - 32px)); margin: 14px 0 0; }
    .ex-barres span { flex: 1; height: 4px; border-radius: 2px; background: var(--bord-fort); overflow: hidden; }
    .ex-barres span.vu { background: var(--accent); }
    .ex-fermer { position: absolute; top: 24px; right: 16px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); font-size: 1.1rem; cursor: pointer; }
    .ex-carte { position: relative; z-index: 1; width: min(560px, calc(100% - 32px)); flex: 1; overflow-y: auto; padding: 44px 4px 30px; display: flex; flex-direction: column; justify-content: center; gap: 14px; pointer-events: none; }
    .ex-carte a, .ex-carte button { pointer-events: auto; position: relative; z-index: 3; }
    .ex-zone { position: absolute; top: 70px; bottom: 0; width: 50%; z-index: 2; background: none; border: 0; cursor: pointer; }
    .ex-prec { left: 0; width: 30%; } .ex-suiv { right: 0; width: 70%; }
    .ex-tete { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--doux); }
    .ex-grand { font-size: clamp(1.8rem, 6vw, 2.4rem); line-height: 1.15; margin: 0; }
    .ex-titre { font-size: clamp(1.35rem, 4.5vw, 1.7rem); line-height: 1.25; margin: 0; }
    .ex-chiffre { font-family: var(--titre); font-size: clamp(3.5rem, 16vw, 5.5rem); font-weight: 700; line-height: 1; color: var(--accent); }
    .ex-texte { font-size: 1.1rem; line-height: 1.5; margin: 0; } .ex-texte.petit { font-size: .98rem; color: var(--doux); }
    .ex-liste, .ex-retenir { margin: 0; padding-left: 22px; display: grid; gap: 12px; font-size: 1.05rem; line-height: 1.45; }
    .ex-aide { color: var(--doux); font-size: .9rem; margin: 10px 0 0; }
    .ex-lien { font-weight: 600; width: fit-content; }
    .ex-fin { display: flex; gap: 10px; flex-wrap: wrap; }
    .express .schema { pointer-events: none; }
    @media (max-width: 560px) { .gm-ligne { grid-template-columns: 84px 1fr 58px; gap: 8px; font-size: .85rem; } .sch-aa { grid-template-columns: 1fr; } .sch-fleche { transform: rotate(90deg); justify-self: center; } }
    /* 1. L'essentiel en puces */
    .essentiel { list-style: none; margin: 4px 0 18px; padding: 0; display: grid; gap: 10px; max-width: 760px; position: relative; }
    .essentiel li { display: flex; gap: 12px; align-items: center; font-size: 1.08rem; line-height: 1.4; }
    .essentiel .ess-ic { flex: 0 0 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.12); color: #fff; }
    .synthese-complete summary { cursor: pointer; font-size: .88rem; opacity: .85; margin-bottom: 14px; }
    .synthese-complete p { margin: 0 0 16px; max-width: 760px; }
    /* 2. Incontournables + liste compacte */
    .actus.incontournables { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .compactes { display: grid; gap: 8px; margin-top: 18px; }
    .compacte { border: 1px solid var(--bord); border-radius: 14px; background: var(--carte); }
    .compacte > summary { list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
    .compacte > summary::-webkit-details-marker { display: none; }
    .compacte > summary h3 { margin: 0; font-size: .98rem; line-height: 1.35; flex: 1; font-weight: 600; }
    .compacte > summary::after { content: "+"; font-size: 1.2rem; color: var(--doux); flex: 0 0 auto; }
    .compacte[open] > summary::after { content: "−"; }
    .compacte-detail { padding: 0 16px 14px; display: grid; gap: 10px; }
    .compacte-detail p { margin: 0; font-size: .93rem; line-height: 1.55; color: var(--doux); }
    .titre-liste { margin: 26px 0 0; font-size: 1rem; color: var(--doux); font-weight: 600; }
    /* 7. Importance : un point de couleur */
    .imp { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; display: inline-block; background: var(--bord-fort); }
    .imp.n3 { background: #f2b632; } .imp.n4 { background: #ef7d22; } .imp.n5 { background: var(--ko); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ko) 25%, transparent); }
    .imp-libelle { font-size: .75rem; font-weight: 700; color: var(--ko); }
    /* 6. Filtre par thème */
    .filtre-actus { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 0 14px; padding-bottom: 2px; }
    .filtre-actus::-webkit-scrollbar { display: none; }
    .filtre-actus .puce { flex: 0 0 auto; }
    /* 3 + 4. Barre de sections (téléphone) et progression */
    .progression { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0; z-index: 60; transition: width .1s linear; }
    .barre-sections { display: none; }
    .reste { font-size: .8rem; color: var(--doux); white-space: nowrap; }
    @media (max-width: 1000px) {
      .barre-sections { display: flex; gap: 6px; align-items: center; position: sticky; top: 0; z-index: 30; margin: 0 0 16px; padding: 10px 2px;
        background: color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter: blur(8px); overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--bord); }
      .barre-sections::-webkit-scrollbar { display: none; }
      .barre-sections a { flex: 0 0 auto; text-decoration: none; padding: 7px 12px; border-radius: 999px; font-size: .85rem; color: var(--doux); background: var(--carte); border: 1px solid var(--bord); }
      .barre-sections a.actif { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); font-weight: 600; }
      .barre-sections .reste { margin-left: 4px; }
    }
    /* 5. Glossaire */
    .terme { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help; text-decoration: underline dotted; text-decoration-color: var(--accent); text-underline-offset: 3px; }
    .hero .terme { text-decoration-color: rgba(255,255,255,.7); }
    .bulle-terme { position: absolute; z-index: 120; max-width: min(320px, calc(100vw - 24px)); background: var(--texte); color: var(--carte); padding: 10px 12px; border-radius: 12px; font-size: .88rem; line-height: 1.45; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: grid; gap: 4px; }
    .avertissement { font-size: .85rem; color: var(--doux); border: 1px dashed var(--bord-fort); border-radius: 12px; padding: 10px 14px; }
  </style>
</head>
<body>
  <div class="progression" id="progression" aria-hidden="true"></div>
  <header class="entete" id="entete"></header>
  <main class="page brief-page">
    <div class="brief-grille">
      <aside class="brief-nav" aria-label="Navigation du brief">
        <div>
          <p class="petit-titre">Édition</p>
          <div class="onglets" role="tablist" aria-label="Édition du brief">
            <button type="button" role="tab" id="tab-matin" data-edition="matin" aria-selected="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Matin · 7 h</button>
            <button type="button" role="tab" id="tab-soir" data-edition="soir" aria-selected="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>Soir · 18 h</button>
          </div>
        </div>
        <div><label class="petit-titre" for="historique">Jour</label><select id="historique"></select></div>
        <nav class="bloc-sommaire" aria-label="Sommaire"><p class="petit-titre">Sommaire</p><ul class="sommaire" id="sommaire"></ul></nav>
      </aside>
      <div id="brief"><p class="doux">Chargement…</p></div>
    </div>
  </main>
  <script>
    const dateLongue = (jour) => new Date(jour + "T12:00:00Z").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    const majuscule = (t) => t.charAt(0).toUpperCase() + t.slice(1);

    // Une actualité : grande carte (incontournable) ou ligne compacte dépliable.
    function carteActu(a, b, grande) {
      const t = themeDe(a.categories), s = (b.schemas || {})[a.id], n = a.importance || 0;
      const imp = `<span class="imp n${n}" title="Importance ${n}/5" aria-label="Importance ${n} sur 5"></span>${n >= 5 ? '<span class="imp-libelle">Majeur</span>' : ""}`;
      const resume = a.resume ? `<p class="${grande && a.resume.length > 220 ? "resume-long" : ""}">${echapper(a.resume)}</p>${grande && a.resume.length > 220 ? '<button type="button" class="lire-suite no-print">Lire la suite</button>' : ""}` : "";
      const sources = `<div class="sources">${(a.sources || []).map((x) => `<a class="source" href="${echapper(x.lien)}" target="_blank" rel="noopener noreferrer">${echapper(x.nom)} ↗</a>`).join("")}
        <a class="source no-print" href="/linkedin?sujet=${encodeURIComponent(a.id)}" title="Préparer un post LinkedIn sur ce sujet">✏️ Post LinkedIn</a></div>`;
      if (grande) return `<article class="actu th-${t.id}" data-theme="${t.id}">
        <div class="actu-haut">${picto(t.id)}<div class="meta th-${t.id}"><span class="etiquette">${echapper((a.categories || [])[0] || t.nom)}</span></div>${imp}</div>
        <h3><a href="${lienSujet(a.id)}">${echapper(a.titre)}</a></h3>${schemaActu(s)}${resume}${sources}</article>`;
      return `<details class="compacte th-${t.id}" data-theme="${t.id}"><summary>${imp}<h3>${echapper(a.titre)}</h3></summary>
        <div class="compacte-detail"><div class="meta th-${t.id}"><span class="etiquette">${echapper((a.categories || [])[0] || t.nom)}</span></div>${schemaActu(s)}${resume}
        <a href="${lienSujet(a.id)}" class="petit">Voir le sujet complet →</a>${sources}</div></details>`;
    }

    function afficher(b) {
      const puces = (b.essentiel && b.essentiel.length) ? b.essentiel
        : (b.synthese || "").split(/(?<=[.!?])\s+(?=[A-ZÀ-Ý])/).filter(Boolean).slice(0, 3).map((t) => ({ icone: "graphique", texte: t }));
      const valeurs = b.marches ? [...(b.marches.valeurs || []), ...(b.marches.autres || [])].filter((v) => typeof v.variation === "number") : [];
      let html = `<section class="hero" id="b-synthese">
        <svg class="hero-deco" viewBox="0 0 400 260" aria-hidden="true"><circle cx="300" cy="90" r="120" fill="#3a49d6"/><circle cx="210" cy="190" r="70" fill="#5e6cf0"/>
          <path d="M40 220 L120 170 L180 190 L260 110 L340 130 L400 60" fill="none" stroke="#9aa4ff" stroke-width="4" stroke-linecap="round"/></svg>
        <div class="surtitre">${b.edition === "soir" ? "Le point du soir · actualités parues depuis 7 h" : "Le brief du matin · les dernières 24 heures"} · rédigé ${quand(b.genere_le || b.cree_le)}</div>
        <h1>${b.edition === "soir" ? "Le point de la journée" : "Brief du matin"} · ${dateLongue(b.jour)}</h1>
        ${puces.length ? `<ul class="essentiel">${puces.map((e) => `<li><span class="ess-ic">${pictoSchema(e.icone, 20)}</span><span>${echapper(typoFr(e.texte))}</span></li>`).join("")}</ul>
          ${b.essentiel && b.synthese ? `<details class="synthese-complete"><summary>Lire la synthèse complète</summary><p>${echapper(b.synthese)}</p></details>` : ""}`
          : `<p>${echapper(b.synthese || "Brief produit sans synthèse (IA indisponible ce matin-là) : retrouvez ci-dessous les actualités majeures.")}</p>`}
        <div class="actions-hero no-print">
          <button type="button" class="bouton bouton-express" id="btn-express">⚡ Version Express · 1 min</button>
          <button type="button" class="bouton second" id="btn-ecouter">${ICONE_ECOUTE} Écouter le brief</button>
          <button type="button" class="bouton second" onclick="print()">Imprimer</button>
        </div>
      </section>`;

      if (b.chiffre_du_jour) {
        const c = b.chiffre_du_jour;
        html += `<section class="carte bloc" id="b-chiffre"><h2>Le chiffre du jour</h2><div class="chiffre-brief">
          <span class="chiffre-valeur">${echapper(c.valeur)}</span><span style="font-size:1.05rem">${echapper(c.libelle)}</span></div>
          <p class="doux petit" style="margin:10px 0 0">${c.source ? "Source : " + echapper(c.source) + " · " : ""}<a href="${lienSujet(c.sujet_id)}">voir le sujet</a></p></section>`;
      }

      if (b.a_retenir && b.a_retenir.length) html += `<section class="carte bloc" id="b-retenir"><h2>${b.edition === "soir" ? "À garder en tête pour demain" : "À retenir pour mes rendez-vous clients"}</h2>
        <ol class="retenir">${b.a_retenir.map((p, i) => `<li><span class="retenir-num">${i + 1}</span><span>${echapper(p.texte)}</span><a href="${lienSujet(p.sujet_id)}">Voir le sujet →</a></li>`).join("")}</ol></section>`;

      // Les 3 incontournables en grand, les autres en liste compacte (triées par importance).
      const actus = [...(b.actualites || [])].map((a, i) => ({ a, i })).sort((x, y) => (y.a.importance || 0) - (x.a.importance || 0) || x.i - y.i).map((x) => x.a);
      const themes = [...new Map(actus.map((a) => { const t = themeDe(a.categories); return [t.id, t]; })).values()];
      html += `<section id="b-actus"><div class="titre-section"><h2>${b.edition === "soir" ? "Les actualités majeures de la journée" : "Les actualités majeures des dernières 24 heures"}</h2></div>
        ${themes.length > 1 ? `<div class="filtre-actus no-print" role="group" aria-label="Filtrer par thème"><button type="button" class="puce" data-filtre="" aria-pressed="true">Toutes · ${actus.length}</button>
          ${themes.map((t) => `<button type="button" class="puce" data-filtre="${t.id}" aria-pressed="false">${echapper(t.nom)} · ${actus.filter((a) => themeDe(a.categories).id === t.id).length}</button>`).join("")}</div>` : ""}
        ${actus.length ? `<div class="actus incontournables">${actus.slice(0, 3).map((a) => carteActu(a, b, true)).join("")}</div>
          ${actus.length > 3 ? `<p class="titre-liste" id="titre-liste">Les autres actualités · touchez pour déplier</p><div class="compactes">${actus.slice(3).map((a) => carteActu(a, b, false)).join("")}</div>` : ""}`
          : `<p class="doux">Aucune actualité majeure sur la période.</p>`}
      </section>`;

      html += `<section class="carte bloc" id="b-marches"><h2>${b.edition === "soir" ? "Marchés : la séance du jour" : "Marchés : clôtures de la veille"}</h2>
        ${b.commentaire_marches ? `<p style="margin:0">${echapper(b.commentaire_marches)}</p>` : ""}
        ${valeurs.length ? `${graphiqueMarches(valeurs)}
          <p class="doux petit" style="margin:8px 0 0">Estimations via des fonds indiciels cotés à New York (voir la page Marchés)${b.edition === "soir" ? ", relevées pendant la séance : Europe clôturée, New York en cours" : ""}.</p>`
          : `<p class="doux" style="margin:0">Aucun relevé de clôture disponible pour ce jour.</p>`}
      </section>`;

      if ((b.quiz || []).length) html += `<section class="carte bloc" id="b-quiz"><h2>Testez-vous : avez-vous retenu l'essentiel ?</h2><div id="quiz-brief"></div></section>`;

      html += `<p class="avertissement">${b.ia_modele ? "Synthèse, chiffre du jour et points à retenir rédigés par une IA" : "Brief produit sans synthèse (IA indisponible ce matin-là)"} à partir des résumés des sources et des relevés de marché.
        Vérifiez les points importants dans les articles originaux avant d'en faire état. Ce contenu est informatif et ne constitue pas un conseil en investissement.</p>`;
      document.getElementById("brief").innerHTML = `<nav class="barre-sections no-print" id="barre-sections" aria-label="Sections du brief"></nav>` + html;
      construireSommaire();
      activerGlossaire(document.getElementById("brief"));
      // Filtre par thème
      document.querySelectorAll("[data-filtre]").forEach((f) => f.onclick = () => {
        document.querySelectorAll("[data-filtre]").forEach((x) => x.setAttribute("aria-pressed", x === f));
        document.querySelectorAll("#b-actus [data-theme]").forEach((c) => { c.hidden = !!f.dataset.filtre && c.dataset.theme !== f.dataset.filtre; });
        const tl = document.getElementById("titre-liste"); if (tl) tl.hidden = ![...document.querySelectorAll(".compacte")].some((c) => !c.hidden);
      });
      // Temps de lecture total (environ 200 mots par minute), pour la barre de progression.
      tempsTotal = Math.max(1, Math.round(document.getElementById("brief").innerText.split(/\s+/).length / 200));
      majProgression();
      if ((b.quiz || []).length) quizInteractif(document.getElementById("quiz-brief"), b.quiz.map((q) => ({ ...q, lien: lienSujet(q.sujet_id) })),
        { cle: `actu:${b.jour}-${b.edition || "matin"}` });
      window.speechSynthesis?.cancel();
      document.getElementById("btn-ecouter").onclick = (e) => ecouterBrief(b, e.currentTarget);
      document.getElementById("btn-express").onclick = () => ouvrirExpress(b, valeurs);
      document.querySelectorAll(".lire-suite").forEach((x) => x.onclick = () => { const p = x.previousElementSibling; p.classList.toggle("ouvert"); x.textContent = p.classList.contains("ouvert") ? "Réduire" : "Lire la suite"; });
      if (new URLSearchParams(location.search).get("express") === "1") { history.replaceState(null, "", location.pathname + location.search.replace(/[?&]express=1/, "")); ouvrirExpress(b, valeurs); }
    }

    // Sommaire de la colonne de gauche : un lien par section, celui de la section visible est surligné.
    const NOMS = { "b-synthese": "L'essentiel", "b-chiffre": "Le chiffre du jour", "b-retenir": "À retenir", "b-actus": "Les actualités", "b-marches": "Les marchés", "b-quiz": "Testez-vous" };
    const NOMS_COURTS = { "b-synthese": "Essentiel", "b-chiffre": "Chiffre", "b-retenir": "Rendez-vous", "b-actus": "Actus", "b-marches": "Marchés", "b-quiz": "Quiz" };
    let tempsTotal = 1;
    function majProgression() {
      const h = document.documentElement.scrollHeight - innerHeight, p = h > 0 ? Math.min(1, scrollY / h) : 1;
      document.getElementById("progression").style.width = (p * 100).toFixed(1) + "%";
      const reste = Math.ceil(tempsTotal * (1 - p)), txt = p > 0.97 ? "Terminé ✓" : `≈ ${reste} min restante${reste > 1 ? "s" : ""}`;
      document.querySelectorAll(".reste").forEach((r) => r.textContent = txt);
    }
    addEventListener("scroll", () => requestAnimationFrame(majProgression), { passive: true });
    let observateur = null;
    function construireSommaire() {
      const sections = [...document.querySelectorAll("#brief > section[id]")];
      document.getElementById("sommaire").innerHTML = sections.map((x) => `<li><a href="#${x.id}" data-cible="${x.id}">${NOMS[x.id] || ""}</a></li>`).join("") + `<li style="padding:10px 14px"><span class="reste"></span></li>`;
      const barre = document.getElementById("barre-sections");
      if (barre) barre.innerHTML = sections.map((x) => `<a href="#${x.id}" data-cible="${x.id}">${NOMS_COURTS[x.id] || ""}</a>`).join("") + `<span class="reste"></span>`;
      observateur?.disconnect();
      observateur = new IntersectionObserver((entrees) => {
        const visible = entrees.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (!visible) return;
        document.querySelectorAll("#sommaire a, #barre-sections a").forEach((a) => a.classList.toggle("actif", a.dataset.cible === visible.target.id));
        const actif = document.querySelector("#barre-sections a.actif"); if (actif) actif.scrollIntoView({ block: "nearest", inline: "center" });
      }, { rootMargin: "-90px 0px -55% 0px" });
      sections.forEach((x) => observateur.observe(x));
    }

    let editions = [];
    async function charger(jour, edition) {
      const q = jour ? `?jour=${encodeURIComponent(jour)}&edition=${edition || "matin"}` : "";
      const r = await appelApi("/api/brief" + q);
      editions = r.editions || [];
      const choix = document.getElementById("historique");
      choix.innerHTML = r.jours.length ? r.jours.map((j) => `<option value="${j}">${majuscule(dateLongue(j))}</option>`).join("") : "<option>Aucun</option>";
      if (!r.brief) {
        document.getElementById("brief").innerHTML = `<div class="carte"><h1>Brief</h1><p><strong>Pas encore de brief pour cette édition.</strong></p>
          <p class="doux">Les briefs sont rédigés automatiquement vers 7 h (matin) et vers 18 h (soir), chaque jour, week-end compris.</p></div>`;
        if (jour) choix.value = jour;
        majOnglets(jour, edition);
        return;
      }
      choix.value = r.brief.jour;
      majOnglets(r.brief.jour, r.brief.edition || "matin");
      afficher(r.brief);
    }
    function majOnglets(jour, edition) {
      for (const e of ["matin", "soir"]) {
        const b = document.getElementById("tab-" + e);
        b.setAttribute("aria-selected", e === edition);
        b.disabled = !editions.some((x) => x.jour === jour && x.edition === e);
        b.title = b.disabled ? (e === "soir" ? "Le brief du soir est rédigé vers 18 h" : "Pas de brief du matin ce jour-là") : "";
      }
    }
    function aller(jour, edition) {
      history.replaceState(null, "", `?jour=${jour}&edition=${edition}`);
      charger(jour, edition);
    }
    document.querySelectorAll(".onglets button").forEach((b) => b.onclick = () => aller(document.getElementById("historique").value, b.dataset.edition));
    document.getElementById("historique").addEventListener("change", (e) => {
      const j = e.target.value;
      const ed = editions.some((x) => x.jour === j && x.edition === "soir") ? "soir" : "matin";
      aller(j, ed);
    });
    const ps = new URLSearchParams(location.search);
    chargerEntete("/brief").then(() => charger(ps.get("jour"), ps.get("edition")));
  </script>
</body>
</html>
