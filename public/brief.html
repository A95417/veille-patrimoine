<!doctype html>
<!-- version 9.2 -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brief du jour · Veille Patrimoine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#3a49d6">
  <meta name="apple-mobile-web-app-title" content="Veille">
  <script src="/commun.js"></script>
  <script src="/jeux.js"></script>
  <style>
    .brief-page { max-width: 1320px; }
    .brief-grille { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; align-items: start; }
    .brief-nav { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 22px; }
    .brief-nav .petit-titre { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--doux); margin: 0 0 8px; }
    .onglets { display: flex; flex-direction: column; gap: 6px; }
    .onglets button { font: inherit; font-size: .95rem; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); padding: 12px 14px; border-radius: 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; text-align: left; }
    .onglets button:hover:not(:disabled) { border-color: var(--accent); }
    .onglets button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-texte); font-weight: 600; }
    .onglets button:disabled { opacity: .45; cursor: not-allowed; }
    .brief-nav select { width: 100%; }
    .sommaire { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--bord); }
    .sommaire a { display: block; padding: 7px 14px; margin-left: -2px; border-left: 2px solid transparent; color: var(--doux); text-decoration: none; font-size: .92rem; }
    .sommaire a:hover { color: var(--texte); }
    .sommaire a.actif { color: var(--accent-fonce); border-left-color: var(--accent); font-weight: 600; }
    #brief > section { margin-bottom: 28px; scroll-margin-top: 90px; }
    #brief .carte { padding: 28px 32px; }
    @media (max-width: 1000px) {
      .brief-grille { grid-template-columns: 1fr; gap: 18px; }
      .brief-nav { position: static; flex-direction: row; flex-wrap: wrap; align-items: end; gap: 12px; }
      .brief-nav .bloc-sommaire { display: none; }
      .onglets { flex-direction: row; }
      .onglets button { padding: 9px 12px; }
      #brief .carte { padding: 20px; }
    }
    .bloc h2 { font-size: 1.25rem; margin: 0 0 20px; }
    .mini-marches { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 18px; font-size: .95rem; }
    .mini-marches div { display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: var(--fond); }
    .retenir { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .retenir li { display: flex; flex-direction: column; gap: 10px; line-height: 1.6; padding: 18px 20px; border-radius: 16px; background: var(--fond); }
    .retenir-num { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-texte);
                   font-weight: 700; display: grid; place-items: center; font-size: .9rem; }
    .retenir a { font-size: .88rem; margin-top: auto; }
    .actus { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
    .actu { display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border: 1px solid var(--bord); border-radius: 16px; background: var(--carte); }
    .actu-haut { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .actu h3 { margin: 0; font-size: 1.08rem; line-height: 1.4; }
    .actu h3 a { color: var(--texte); text-decoration: none; }
    .actu h3 a:hover { text-decoration: underline; }
    .actu p { margin: 0; font-size: .95rem; line-height: 1.6; color: var(--doux); }
    .actu .sources { margin-top: auto; padding-top: 6px; }
    .chiffre-brief { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
    .avertissement { font-size: .85rem; color: var(--doux); border: 1px dashed var(--bord-fort); border-radius: 12px; padding: 10px 14px; }
  </style>
</head>
<body>
  <header class="entete" id="entete"></header>
  <main class="page brief-page">
    <div class="brief-grille">
      <aside class="brief-nav" aria-label="Navigation du brief">
        <div>
          <p class="petit-titre">Édition</p>
          <div class="onglets" role="tablist" aria-label="Édition du brief">
            <button type="button" role="tab" id="tab-matin" data-edition="matin" aria-selected="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Matin · 7 h</button>
            <button type="button" role="tab" id="tab-soir" data-edition="soir" aria-selected="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>Soir · 18 h</button>
          </div>
        </div>
        <div><label class="petit-titre" for="historique">Jour</label><select id="historique"></select></div>
        <nav class="bloc-sommaire" aria-label="Sommaire"><p class="petit-titre">Sommaire</p><ul class="sommaire" id="sommaire"></ul></nav>
      </aside>
      <div id="brief"><p class="doux">Chargement…</p></div>
    </div>
  </main>
  <script>
    const dateLongue = (jour) => new Date(jour + "T12:00:00Z").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    const majuscule = (t) => t.charAt(0).toUpperCase() + t.slice(1);

    function afficher(b) {
      const valeurs = b.marches ? [...(b.marches.valeurs || []), ...(b.marches.autres || [])].filter((v) => typeof v.variation === "number") : [];
      let html = `<section class="hero" id="b-synthese">
        <svg class="hero-deco" viewBox="0 0 400 260" aria-hidden="true"><circle cx="300" cy="90" r="120" fill="#3a49d6"/><circle cx="210" cy="190" r="70" fill="#5e6cf0"/>
          <path d="M40 220 L120 170 L180 190 L260 110 L340 130 L400 60" fill="none" stroke="#9aa4ff" stroke-width="4" stroke-linecap="round"/></svg>
        <div class="surtitre">${b.edition === "soir" ? "Le point du soir · actualités parues depuis 7 h" : "Le brief du matin · les dernières 24 heures"} · rédigé ${quand(b.genere_le || b.cree_le)}</div>
        <h1>${b.edition === "soir" ? "Le point de la journée" : "Brief du matin"} · ${dateLongue(b.jour)}</h1>
        <p>${echapper(b.synthese || "Brief produit sans synthèse (IA indisponible ce matin-là) : retrouvez ci-dessous les actualités majeures.")}</p>
        <div class="actions-hero no-print">
          <button type="button" class="bouton" id="btn-ecouter">${ICONE_ECOUTE} Écouter le brief</button>
          <button type="button" class="bouton second" onclick="print()">Imprimer</button>
        </div>
      </section>`;

      if (b.chiffre_du_jour) {
        const c = b.chiffre_du_jour;
        html += `<section class="carte bloc" id="b-chiffre"><h2>Le chiffre du jour</h2><div class="chiffre-brief">
          <span class="chiffre-valeur">${echapper(c.valeur)}</span><span style="font-size:1.05rem">${echapper(c.libelle)}</span></div>
          <p class="doux petit" style="margin:10px 0 0">${c.source ? "Source : " + echapper(c.source) + " · " : ""}<a href="${lienSujet(c.sujet_id)}">voir le sujet</a></p></section>`;
      }

      if (b.a_retenir && b.a_retenir.length) html += `<section class="carte bloc" id="b-retenir"><h2>${b.edition === "soir" ? "À garder en tête pour demain" : "À retenir pour mes rendez-vous clients"}</h2>
        <ol class="retenir">${b.a_retenir.map((p, i) => `<li><span class="retenir-num">${i + 1}</span><span>${echapper(p.texte)}</span><a href="${lienSujet(p.sujet_id)}">Voir le sujet →</a></li>`).join("")}</ol></section>`;

      html += `<section id="b-actus"><div class="titre-section"><h2>${b.edition === "soir" ? "Les actualités majeures de la journée" : "Les actualités majeures des dernières 24 heures"}</h2></div>
        ${(b.actualites || []).length ? `<div class="actus">${b.actualites.map((a) => {
          const t = themeDe(a.categories);
          return `<article class="actu">
            <div class="actu-haut">${picto(t.id)}<div class="meta th-${t.id}"><span class="etiquette">${echapper((a.categories || [])[0] || t.nom)}</span><span class="niveau n${a.importance}">Importance ${a.importance}/5</span></div></div>
            <h3><a href="${lienSujet(a.id)}">${echapper(a.titre)}</a></h3>
            ${a.resume ? `<p>${echapper(a.resume)}</p>` : ""}
            <div class="sources">${(a.sources || []).map((s) => `<a class="source" href="${echapper(s.lien)}" target="_blank" rel="noopener noreferrer">${echapper(s.nom)} ↗</a>`).join("")}</div>
          </article>`;
        }).join("")}</div>` : `<p class="doux">Aucune actualité majeure sur la période.</p>`}
      </section>`;

      html += `<section class="carte bloc" id="b-marches"><h2>${b.edition === "soir" ? "Marchés : la séance du jour" : "Marchés : clôtures de la veille"}</h2>
        ${b.commentaire_marches ? `<p style="margin:0">${echapper(b.commentaire_marches)}</p>` : ""}
        ${valeurs.length ? `<div class="mini-marches">${valeurs.map((v) =>
            `<div><span>${echapper(nomCourt(v))}</span>${formatVariation(v.variation)}</div>`).join("")}</div>
          <p class="doux petit" style="margin:8px 0 0">Estimations via des fonds indiciels cotés à New York (voir la page Marchés)${b.edition === "soir" ? ", relevées pendant la séance : Europe clôturée, New York en cours" : ""}.</p>`
          : `<p class="doux" style="margin:0">Aucun relevé de clôture disponible pour ce jour.</p>`}
      </section>`;

      if ((b.quiz || []).length) html += `<section class="carte bloc" id="b-quiz"><h2>Testez-vous : avez-vous retenu l'essentiel ?</h2><div id="quiz-brief"></div></section>`;

      html += `<p class="avertissement">${b.ia_modele ? "Synthèse, chiffre du jour et points à retenir rédigés par une IA" : "Brief produit sans synthèse (IA indisponible ce matin-là)"} à partir des résumés des sources et des relevés de marché.
        Vérifiez les points importants dans les articles originaux avant d'en faire état. Ce contenu est informatif et ne constitue pas un conseil en investissement.</p>`;
      document.getElementById("brief").innerHTML = html;
      construireSommaire();
      if ((b.quiz || []).length) quizInteractif(document.getElementById("quiz-brief"), b.quiz.map((q) => ({ ...q, lien: lienSujet(q.sujet_id) })),
        { cle: `actu:${b.jour}-${b.edition || "matin"}` });
      window.speechSynthesis?.cancel();
      document.getElementById("btn-ecouter").onclick = (e) => ecouterBrief(b, e.currentTarget);
    }

    // Sommaire de la colonne de gauche : un lien par section, celui de la section visible est surligné.
    const NOMS = { "b-synthese": "L'essentiel", "b-chiffre": "Le chiffre du jour", "b-retenir": "À retenir", "b-actus": "Les actualités", "b-marches": "Les marchés", "b-quiz": "Testez-vous" };
    let observateur = null;
    function construireSommaire() {
      const sections = [...document.querySelectorAll("#brief > section[id]")];
      document.getElementById("sommaire").innerHTML = sections.map((x) => `<li><a href="#${x.id}" data-cible="${x.id}">${NOMS[x.id] || ""}</a></li>`).join("");
      observateur?.disconnect();
      observateur = new IntersectionObserver((entrees) => {
        const visible = entrees.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (!visible) return;
        document.querySelectorAll("#sommaire a").forEach((a) => a.classList.toggle("actif", a.dataset.cible === visible.target.id));
      }, { rootMargin: "-90px 0px -55% 0px" });
      sections.forEach((x) => observateur.observe(x));
    }

    let editions = [];
    async function charger(jour, edition) {
      const q = jour ? `?jour=${encodeURIComponent(jour)}&edition=${edition || "matin"}` : "";
      const r = await appelApi("/api/brief" + q);
      editions = r.editions || [];
      const choix = document.getElementById("historique");
      choix.innerHTML = r.jours.length ? r.jours.map((j) => `<option value="${j}">${majuscule(dateLongue(j))}</option>`).join("") : "<option>Aucun</option>";
      if (!r.brief) {
        document.getElementById("brief").innerHTML = `<div class="carte"><h1>Brief</h1><p><strong>Pas encore de brief pour cette édition.</strong></p>
          <p class="doux">Les briefs sont rédigés automatiquement vers 7 h (matin) et vers 18 h (soir), chaque jour, week-end compris.</p></div>`;
        if (jour) choix.value = jour;
        majOnglets(jour, edition);
        return;
      }
      choix.value = r.brief.jour;
      majOnglets(r.brief.jour, r.brief.edition || "matin");
      afficher(r.brief);
    }
    function majOnglets(jour, edition) {
      for (const e of ["matin", "soir"]) {
        const b = document.getElementById("tab-" + e);
        b.setAttribute("aria-selected", e === edition);
        b.disabled = !editions.some((x) => x.jour === jour && x.edition === e);
        b.title = b.disabled ? (e === "soir" ? "Le brief du soir est rédigé vers 18 h" : "Pas de brief du matin ce jour-là") : "";
      }
    }
    function aller(jour, edition) {
      history.replaceState(null, "", `?jour=${jour}&edition=${edition}`);
      charger(jour, edition);
    }
    document.querySelectorAll(".onglets button").forEach((b) => b.onclick = () => aller(document.getElementById("historique").value, b.dataset.edition));
    document.getElementById("historique").addEventListener("change", (e) => {
      const j = e.target.value;
      const ed = editions.some((x) => x.jour === j && x.edition === "soir") ? "soir" : "matin";
      aller(j, ed);
    });
    const ps = new URLSearchParams(location.search);
    chargerEntete("/brief").then(() => charger(ps.get("jour"), ps.get("edition")));
  </script>
</body>
</html>
