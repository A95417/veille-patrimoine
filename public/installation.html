<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Installation · Veille Patrimoine</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/commun.js"></script>
</head>
<body>
  <main class="centre">
    <form class="carte carte-etroite" id="formulaire" hidden>
      <h1>Créer le compte administrateur</h1>
      <p class="doux">Cette page ne sert qu'une seule fois. Elle disparaît dès que le premier compte est créé.</p>
      <label for="code">Code d'installation</label>
      <input id="code" type="password" autocomplete="off" required>
      <label for="nom">Votre nom</label>
      <input id="nom" type="text" autocomplete="name" required>
      <label for="email">Votre e-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="mdp">Mot de passe (10 caractères minimum)</label>
      <input id="mdp" type="password" autocomplete="new-password" minlength="10" required>
      <button class="bouton bouton-large" id="bouton" type="submit">Créer mon compte</button>
      <div class="message" id="message" role="alert"></div>
    </form>
    <div class="carte carte-etroite" id="indisponible" hidden>
      <h1>Installation indisponible</h1>
      <p class="doux">Le compte administrateur existe déjà, ou le code d'installation n'est pas configuré.</p>
      <a class="bouton" href="/connexion">Aller à la connexion</a>
    </div>
  </main>
  <script>
    appelApi("/api/installation").then((r) => {
      document.getElementById(r.disponible ? "formulaire" : "indisponible").hidden = false;
    });
    document.getElementById("formulaire").addEventListener("submit", async (e) => {
      e.preventDefault();
      const bouton = document.getElementById("bouton");
      const message = document.getElementById("message");
      bouton.disabled = true;
      afficherMessage(message, "");
      try {
        await appelApi("/api/installation", "POST", {
          code: document.getElementById("code").value,
          nom: document.getElementById("nom").value,
          email: document.getElementById("email").value,
          mot_de_passe: document.getElementById("mdp").value,
        });
        location.href = "/admin";
      } catch (err) {
        afficherMessage(message, err.message, "ko");
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
